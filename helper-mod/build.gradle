// The loader plugins are declared once here so every project uses the same copy of them.
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

subprojects {
    group = 'cc.kokodev.stratpanel'
    version = rootProject.mod_version
}

// One jar for both loaders. Fabric reads fabric.mod.json and starts StratFabric, NeoForge reads (neoforge.)mods.toml and finds
// StratNeo by its @Mod annotation, each ignores what is meant for the other. The code of every generation is in the jar once for each
// loader (g121fabric, g121neoforge, ...), the entry points load the one that fits the loader and the game. The Fabric 1.20 and 1.21
// versions are renamed to the names Fabric uses when running, the rest is already in the jar.
tasks.register('universalJar', Jar) {
    archiveFileName = "stratosphere-mod-${mod_version}.jar"
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(zipTree(project(':core').tasks.named('jar').flatMap { it.archiveFile }))
    from(zipTree(project(':fabric-26').tasks.named('jar').flatMap { it.archiveFile }))
    from(zipTree(project(':neoforge-26').tasks.named('jar').flatMap { it.archiveFile })) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from(zipTree(project(':fabric-120').tasks.named('remapJar').flatMap { it.archiveFile })) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from(zipTree(project(':fabric-1204').tasks.named('remapJar').flatMap { it.archiveFile })) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from(zipTree(project(':fabric-1206').tasks.named('remapJar').flatMap { it.archiveFile })) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from(zipTree(project(':fabric-121').tasks.named('remapJar').flatMap { it.archiveFile })) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from(zipTree(project(':fabric-1214').tasks.named('remapJar').flatMap { it.archiveFile })) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from(zipTree(project(':fabric-1218').tasks.named('remapJar').flatMap { it.archiveFile })) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from(zipTree(project(':fabric-12111').tasks.named('remapJar').flatMap { it.archiveFile })) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from(zipTree(project(':neoforge-1204').tasks.named('jar').flatMap { it.archiveFile })) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from(zipTree(project(':neoforge-1206').tasks.named('jar').flatMap { it.archiveFile })) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from(zipTree(project(':neoforge-121').tasks.named('jar').flatMap { it.archiveFile })) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from(zipTree(project(':neoforge-1214').tasks.named('jar').flatMap { it.archiveFile })) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from(zipTree(project(':neoforge-1218').tasks.named('jar').flatMap { it.archiveFile })) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from(zipTree(project(':neoforge-12111').tasks.named('jar').flatMap { it.archiveFile })) {
        exclude 'META-INF/MANIFEST.MF'
    }
}

tasks.register('mods') {
    dependsOn 'universalJar'
}

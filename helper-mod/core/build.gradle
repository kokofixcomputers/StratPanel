plugins {
    id 'java-library'
}

// Java 17 bytecode so the jar loads on Java 17 (Minecraft 1.20 to 1.20.4), 21 (1.20.5 to 1.21.x) and 25 (26.x).
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    maven { url = 'https://libraries.minecraft.net' }
}

dependencies {
    // Both are on the classpath of every Minecraft server, so they are not bundled.
    compileOnly 'com.mojang:brigadier:1.3.10'
    compileOnly 'com.google.code.gson:gson:2.11.0'
    testImplementation 'com.mojang:brigadier:1.3.10'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.test {
    useJUnitPlatform()
}

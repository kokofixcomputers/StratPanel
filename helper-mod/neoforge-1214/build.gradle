plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

neoForge {
    version = project.neoforge_1214
}

dependencies {
    implementation project(':core')
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

ext.gen = 'g1214'
ext.genDir = 'mc-1214'
ext.hooksDir = 'neoforge-hooks'
apply from: rootProject.file('gen.gradle')

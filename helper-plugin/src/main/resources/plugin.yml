# The class keeps its original name, the plugin is called Stratosphere.
main: ${PACKAGE}.StratPanel
name: ${NAME}
version: "${VERSION}"
api-version: "1.21"
authors: [kokodev]
description: Shares the commands and the players of the server with the Stratosphere panel for tab completion and the player list.

commands:
  stratpanelhidepanellogs:
    description: Used by the panel to talk to this plugin (console only). The panel hides all lines that mention it.
    usage: /stratpanelhidepanellogs <handshake|refresh|sync|scan|perf|vitals>
